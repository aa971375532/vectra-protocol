<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="100%" stop-color="#051412"/>
    </linearGradient>
    <linearGradient id="solanaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#solanaGrad)" stroke-width="12" />
  
  <!-- 科技光环背景 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#9945FF" stroke-width="2" opacity="0.3" stroke-dasharray="10 15" />
  <circle cx="256" cy="256" r="200" fill="none" stroke="#14F195" stroke-width="2" opacity="0.2" />

  <!-- Vectra 标志性 'V' 与闪电智能几何核心 -->
  <g filter="url(#glow)">
    <!-- 左翼 (紫) -->
    <path d="M 120 130 L 220 370 L 256 370 L 190 130 Z" fill="url(#solanaGrad)" />
    <!-- 右翼与闪电折角 (绿) -->
    <path d="M 392 130 L 256 390 L 220 390 L 320 130 Z" fill="url(#solanaGrad)" />
    <!-- 中间 AI 向量核心能量点 -->
    <circle cx="256" cy="180" r="18" fill="#14F195" />
    <path d="M 256 220 L 280 270 L 240 290 L 265 350" stroke="#14F195" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
